<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User List | IBM NJ Client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">IBM NJ Users</h2>

    <!-- Search Bar -->
    <div class="mb-4">
        <input type="text" id="search-input" class="form-control" placeholder="Search users by name or email...">
    </div>

    <!-- Add User Form -->
    <div class="card mb-4">
        <div class="card-header">
            <h5>Add New User</h5>
        </div>
        <div class="card-body">
            <form id="add-user-form">
                <div class="row">
                    <div class="col-md-6">
                        <input type="text" id="name" class="form-control mb-2" placeholder="Name" required>
                    </div>
                    <div class="col-md-6">
                        <input type="email" id="email" class="form-control mb-2" placeholder="Email" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <input type="text" id="username" class="form-control mb-2" placeholder="Username">
                    </div>
                    <div class="col-md-6">
                        <input type="text" id="phone" class="form-control mb-2" placeholder="Phone">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <input type="text" id="website" class="form-control mb-2" placeholder="Website">
                    </div>
                    <div class="col-md-6">
                        <button type="submit" class="btn btn-primary">Add User</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div id="user-list" class="row gy-3"></div>
</div>

<script src="app.js"></script>
</body>
</html>
